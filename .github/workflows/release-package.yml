name: Released package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  install:
    name: Install the published ZIP on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download the release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'agent-workspace-*.zip' --dir "$RUNNER_TEMP/continuity-release"
      - name: Open a project and run its product check
        shell: bash
        run: python .github/scripts/check_release_package.py "$RUNNER_TEMP/continuity-release" "$RELEASE_TAG"
